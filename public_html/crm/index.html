<!-- As quatro páginas do CRM (index, quadro, leads, followups) são iguais: o CRM decide a tela pelo endereço
     e troca de tela sem recarregar. Se mudar esta página, mude as quatro. -->

<meta name="theme-color" content="#ECEAE4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='30' fill='%23141412'/%3E%3Crect x='22' y='27' width='56' height='12' rx='6' fill='%23F4F3EE'/%3E%3Crect x='31' y='45' width='38' height='12' rx='6' fill='%23A9A79F'/%3E%3Crect x='40' y='63' width='20' height='12' rx='6' fill='%23C5F277'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="../marca.js"></script>
<script>
/* antes de pintar a tela: o tema (o salvo ou o do aparelho). As cores são as do CRM (preto e verde-limão), no estilo.css */
(function () {
  var r = document.documentElement;
  try {
    var t = localStorage.getItem('hub-imob-tema');
    if (t === 'dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) r.dataset.theme = 'dark';
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<script src="../senha.js"></script>
<script src="nucleo.js"></script>
<script src="lead.js"></script>
<script src="dashboard.js"></script>
<script src="quadro.js"></script>
<script src="leads.js"></script>
<script src="followups.js"></script>
<script src="ios.js"></script>
</body>
</html>
