<script>
/* antes de pintar a tela: tema (o salvo ou o do aparelho) e as cores da marca (marca.js) */
(function () {
  var r = document.documentElement, m = window.MARCA || {};
  try {
    var t = localStorage.getItem('hub-imob-tema');
    if (t === 'dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) r.dataset.theme = 'dark';
  } catch (e) {}
  var cor = function (c) { return c && window.CSS && CSS.supports && CSS.supports('color', c); };
  if (cor(m.cor)) r.style.setProperty('--marca', m.cor);
  if (cor(m.acento)) r.style.setProperty('--acento', m.acento);
})();
</script>
<style>
/* Hub da imobiliária: as ferramentas da equipe como aplicativos (tela inicial do iPhone) + barra lateral de vidro.
   Mesma ideia do Hub ADM, com a cara de imobiliária: petróleo (confiança) + dourado (padrão alto).
   Claro por padrão: névoa perolada com brilhos de petróleo e areia.
   Escuro: noite petróleo com aurora verde-azulada e dourada, vidro com reflexo e ícones que brilham.
   A cor principal e a de destaque vêm do marca.js (--marca e --acento); o resto deriva delas. */
:root {
  --marca: #0E5B66; --acento: #C8963E;
  --bg: #F3F5F4;
  --brilho1: color-mix(in srgb, var(--marca) 24%, transparent);
  --brilho2: color-mix(in srgb, var(--acento) 34%, transparent);
  --brilho3: color-mix(in srgb, var(--marca) 13%, transparent);
  --vidro: rgba(255, 255, 255, .72); --vidro-borda: rgba(255, 255, 255, .95); --reflexo: inset 0 1px 0 rgba(255, 255, 255, .9);
  --forte: #FFFFFF; --borda: rgba(21, 32, 31, .08); --borda2: rgba(21, 32, 31, .14);
  --texto: #15201F; --suave: #55625F; --apagado: #8E9B98; --titulo2: #A3AFAC; --leve: rgba(21, 32, 31, .05);
  --pri: var(--marca); --pri2: color-mix(in oklab, var(--marca) 70%, white);
  --pri-claro: color-mix(in oklab, var(--marca) 14%, white); --pri-texto: color-mix(in oklab, var(--marca) 85%, black);
  --destaque: var(--marca); --alerta: #E4573D;
  --brilho-marca: color-mix(in srgb, var(--marca) 30%, transparent); --brilho-acento: color-mix(in srgb, var(--acento) 34%, transparent);
  --sombra: 0 1px 2px rgba(21, 32, 31, .04), 0 18px 44px color-mix(in srgb, var(--marca) 11%, transparent);
  --sombra-forte: 0 28px 60px color-mix(in srgb, var(--marca) 20%, transparent);
  --ok: #15803D; --ok-bg: #DCFCE7; --atencao: #A16207; --atencao-bg: #FEF3C7;
  --widget2-bg: color-mix(in oklab, var(--acento) 26%, white); --widget2-txt: #15201F; --widget2-sub: color-mix(in oklab, var(--acento) 45%, #2A2216);
  --ativo-bg: #15201F; --ativo-txt: #FFFFFF;
  --folha-bg: #FFFFFF; --campo-bg: #F5F7F6; --fundo-escuro: rgba(21, 32, 31, .32);
  --erro: #DC2626;
  --pill: 999px;
  --ease: cubic-bezier(.32, .72, 0, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #091416;
  --brilho1: color-mix(in srgb, var(--marca) 58%, transparent);
  --brilho2: color-mix(in srgb, var(--acento) 18%, transparent);
  --brilho3: rgba(38, 104, 160, .26);
  --vidro: rgba(255, 255, 255, .055); --vidro-borda: rgba(255, 255, 255, .1); --reflexo: inset 0 1px 0 rgba(255, 255, 255, .09);
  --forte: #12262A; --borda: rgba(255, 255, 255, .09); --borda2: rgba(255, 255, 255, .16);
  --texto: #EEF5F4; --suave: #A9BCB9; --apagado: #7A918D; --titulo2: #5F7B77; --leve: rgba(255, 255, 255, .07);
  --pri: color-mix(in oklab, var(--marca) 82%, white); --pri2: color-mix(in oklab, var(--marca) 50%, white);
  --pri-claro: color-mix(in srgb, var(--marca) 34%, transparent); --pri-texto: color-mix(in oklab, var(--marca) 25%, white);
  --destaque: color-mix(in oklab, var(--marca) 38%, white);
  --brilho-marca: color-mix(in srgb, var(--pri) 50%, transparent); --brilho-acento: color-mix(in srgb, var(--acento) 42%, transparent);
  --sombra: 0 18px 44px rgba(0, 6, 8, .45); --sombra-forte: 0 30px 70px rgba(0, 6, 8, .6);
  --ok: #6EE7A0; --ok-bg: rgba(74, 222, 128, .14); --atencao: #FCD34D; --atencao-bg: rgba(251, 191, 36, .14);
  --widget2-bg: linear-gradient(150deg, color-mix(in oklab, var(--marca) 72%, #091416) 0%, #0E2427 100%); --widget2-txt: #EEF5F4; --widget2-sub: color-mix(in oklab, var(--acento) 55%, white);
  --ativo-bg: #FFFFFF; --ativo-txt: #091416;
  --folha-bg: #0F2124; --campo-bg: rgba(255, 255, 255, .05); --fundo-escuro: rgba(0, 6, 8, .6);
  --erro: #F87171;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { background: var(--bg); color: var(--texto); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; line-height: 1.45; min-height: 100vh; overflow-x: clip; transition: background .5s, color .5s; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(65vmax 50vmax at 0% -10%, var(--brilho1), transparent 62%),
              radial-gradient(50vmax 40vmax at 105% -5%, var(--brilho2), transparent 60%),
              radial-gradient(60vmax 50vmax at 85% 110%, var(--brilho3), transparent 60%); }
/* no escuro, um pó de estrelas bem discreto por cima da aurora */
:root[data-theme="dark"] body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .5;
  background-image: radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.7), transparent 60%), radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.5px 1.5px at 64% 42%, rgba(255,255,255,.5), transparent 60%), radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1px 1px at 88% 78%, rgba(255,255,255,.5), transparent 60%), radial-gradient(1.5px 1.5px at 46% 88%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1px 1px at 22% 40%, rgba(255,255,255,.45), transparent 60%), radial-gradient(1px 1px at 92% 46%, rgba(255,255,255,.5), transparent 60%); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid color-mix(in srgb, var(--pri) 50%, transparent); outline-offset: 3px; }
a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
svg { display: block; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.tap { transition: transform .35s var(--spring), background .25s, border-color .25s; }
.tap:active { transform: scale(.94); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- estrutura: barra lateral + conteúdo ---------- */
.app { display: flex; min-height: 100vh; }
.lateral { position: sticky; z-index: 20; top: 0; height: 100vh; flex: none; padding: max(18px, env(safe-area-inset-top, 0px)) 0 18px max(18px, env(safe-area-inset-left, 0px)); }
.lateral nav { width: 96px; height: 100%; border-radius: 30px; background: var(--vidro); border: 1px solid var(--vidro-borda); box-shadow: var(--sombra), var(--reflexo);
  backdrop-filter: blur(22px) saturate(1.6); -webkit-backdrop-filter: blur(22px) saturate(1.6); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0; transition: background .5s, border-color .5s; }
.lateral .logo { width: 40px; height: 40px; object-fit: contain; }
.lateral .linha { width: 40px; height: 1px; background: var(--borda); margin: 6px 0; flex: none; }
.lateral .itens { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px; }
.lado-btn { position: relative; width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; flex: none; color: var(--suave); transition: transform .35s var(--spring), background .3s, color .3s; }
.lado-btn svg { width: 24px; height: 24px; }
.lado-btn.ativo { background: var(--ativo-bg); color: var(--ativo-txt); }
.lado-btn .bolha { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--alerta); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--bg); }
.lado-btn .dica { position: absolute; left: calc(100% + 14px); top: 50%; transform: translate(-6px, -50%); opacity: 0; pointer-events: none; white-space: nowrap; background: var(--texto); color: var(--bg); font-size: 13px; font-weight: 600; padding: 7px 11px; border-radius: 10px; transition: opacity .2s, transform .3s var(--spring); z-index: 5; }
.lado-btn .dica .k { font: 600 11px var(--font); opacity: .65; margin-left: 8px; }
@media (hover: hover) { .lado-btn:hover .dica, .lado-btn:focus-visible .dica { opacity: 1; transform: translate(0, -50%); } .lado-btn:hover { transform: scale(1.06); color: var(--texto); } .lado-btn.ativo:hover { color: var(--ativo-txt); } }
.lateral .espaco { flex: 1; }
.redondo { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--forte); border: 1px solid var(--borda); font-weight: 800; font-size: 13px; flex: none; }
.redondo svg { width: 19px; height: 19px; }
.redondo.marca { background: var(--pri-claro); border-color: transparent; color: var(--pri-texto); }

.conteudo { flex: 1; min-width: 0; padding: max(30px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-right, 0px)) 48px 40px; display: flex; flex-direction: column; }
.topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: var(--suave); }
.topo-dir { display: flex; align-items: center; gap: 10px; }
.topo .exemplo { background: var(--pri-claro); color: var(--pri-texto); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: var(--pill); }
.ola { text-align: center; margin-top: clamp(30px, 6vh, 64px); }
.ola p { font-size: 16px; font-weight: 600; color: var(--destaque); }
.ola h1 { font-size: clamp(36px, 5.4vw, 66px); font-weight: 800; letter-spacing: -.05em; line-height: 1.02; margin-top: 8px; text-wrap: balance; }
.ola h1 span { color: var(--titulo2); }

.miolo { display: flex; flex-direction: column; gap: clamp(36px, 5vh, 52px); align-items: center; margin-top: clamp(34px, 6vh, 60px); }
.widgets { display: flex; gap: 16px; width: min(100%, 900px); }
.widgets .widget { flex: 1 1 0; min-width: 0; }
.widget { display: block; border-radius: 30px; padding: 22px; background: var(--vidro); border: 1px solid var(--vidro-borda); box-shadow: var(--sombra), var(--reflexo); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); animation: surge .8s var(--ease) both; transition: transform .5s var(--spring); }
@media (hover: hover) { .widget:hover { transform: translateY(-3px); } }
.widget small { display: block; font-size: 13px; font-weight: 600; color: var(--suave); }
.widget b { display: block; font-size: 34px; font-weight: 800; letter-spacing: -.045em; margin-top: 6px; line-height: 1.1; }
.widget p { font-size: 13px; color: var(--suave); margin-top: 8px; }
.widget.w2 { background: var(--widget2-bg); border-color: transparent; color: var(--widget2-txt); }
.widget.w2 small, .widget.w2 p { color: var(--widget2-sub); }
.widget.w3 b { color: var(--atencao); }

/* ---------- ícones de aplicativo ---------- */
.apps { display: grid; grid-template-columns: repeat(auto-fit, 150px); justify-content: center; gap: 34px 48px; width: min(100%, 900px); }
.app-ic { position: relative; display: flex; flex-direction: column; align-items: center; gap: 11px; text-align: center; animation: surge .8s var(--ease) both; animation-delay: var(--d, 0s); }
.app-ic .quadro { position: relative; width: 128px; height: 128px; border-radius: 36px; display: grid; place-items: center; color: #fff; transition: transform .5s var(--spring), box-shadow .4s; }
.app-ic .quadro svg { width: 54px; height: 54px; }
@media (hover: hover) { .app-ic:hover .quadro { transform: translateY(-5px) scale(1.04); } }
.app-ic:active .quadro { transform: scale(.92); }
.app-ic .nome { font-size: 16px; font-weight: 700; line-height: 1.2; }
.app-ic .desc { font-size: 13px; color: var(--suave); line-height: 1.35; margin-top: -6px; white-space: nowrap; }
.app-ic .bolha { position: absolute; top: -8px; right: -8px; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 17px; background: var(--alerta); color: #fff; font-size: 15px; font-weight: 800; display: grid; place-items: center; border: 3px solid var(--bg); }
.cor-marca { background: linear-gradient(150deg, var(--pri2), var(--marca)); box-shadow: 0 20px 40px var(--brilho-marca), inset 0 1px 0 rgba(255, 255, 255, .35); }
.cor-acento { background: linear-gradient(150deg, color-mix(in oklab, var(--acento) 62%, white), color-mix(in oklab, var(--acento) 88%, black)); box-shadow: 0 20px 40px var(--brilho-acento), inset 0 1px 0 rgba(255, 255, 255, .4); }
:root[data-theme="dark"] .cor-marca { background: linear-gradient(150deg, var(--pri2), color-mix(in oklab, var(--marca) 90%, white)); }
@keyframes surge { from { opacity: 0; transform: translateY(24px) scale(.96); filter: blur(8px); } }

.rodape { text-align: center; color: var(--apagado); font-size: 13px; margin-top: auto; padding-top: 48px; }
.rodape a { color: inherit; } .rodape a:hover { color: var(--destaque); }

/* ---------- resumo do dia, embaixo do título ---------- */
.ola .resumo { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 9px 16px; border-radius: var(--pill); background: var(--vidro); border: 1px solid var(--vidro-borda); box-shadow: var(--sombra), var(--reflexo); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 14px; font-weight: 600; color: var(--suave); text-align: left; animation: surge .8s var(--ease) both; }
.ola .resumo a { color: var(--texto); text-decoration: underline; text-decoration-color: var(--borda2); text-underline-offset: 3px; }
.ola .resumo .luz { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px var(--ok-bg); flex: none; }
.ola .resumo.atencao .luz { background: var(--atencao); box-shadow: 0 0 0 4px var(--atencao-bg); animation: pulsar 2.2s ease-in-out infinite; }
@keyframes pulsar { 50% { box-shadow: 0 0 0 8px var(--atencao-bg); } }
/* redesenho sem repetir a animação de entrada */
#apps.quieto .app-ic, #widgets.quieto .widget { animation: none; }

/* ---------- celular: barra lateral vira barra de baixo ---------- */
@media (max-width: 900px) {
  .miolo { gap: 28px; }
  .widgets { width: min(100%, 560px); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
  .widgets::-webkit-scrollbar { display: none; }
  .widgets .widget { min-width: 230px; flex: 1 0 230px; scroll-snap-align: start; box-shadow: 0 1px 2px rgba(21, 32, 31, .04), 0 8px 18px color-mix(in srgb, var(--marca) 9%, transparent), var(--reflexo); }
}
@media (max-width: 760px) {
  /* os cartões rolam de ponta a ponta da tela, sem cortar a sombra */
  .widgets { width: calc(100% + 32px); max-width: none; margin: -8px -16px -24px; padding: 8px 16px 24px; scroll-padding-inline: 16px; }
}
@media (max-width: 760px) {
  .app { flex-direction: column; }
  .lateral { position: fixed; z-index: 30; top: auto; bottom: 0; left: 0; right: 0; height: auto; padding: 0 max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
  .lateral nav { width: 100%; height: 74px; flex-direction: row; padding: 0 10px; border-radius: 26px; gap: 6px; }
  .lateral .logo, .lateral .linha, .lateral .espaco, #buscar { display: none; }
  .lateral .itens { flex-direction: row; gap: 6px; flex: 1; }
  .lado-btn { width: 50px; height: 50px; border-radius: 16px; }
  .lado-btn .dica { display: none; }
  .redondo { width: 44px; height: 44px; }
  .conteudo { padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .apps { grid-template-columns: repeat(auto-fit, min(140px, 42vw)); gap: 24px 16px; width: 100%; }
  .app-ic .quadro { width: min(96px, 26vw); height: min(96px, 26vw); border-radius: 28px; }
  .app-ic .quadro svg { width: 42px; height: 42px; }
  .app-ic .nome { font-size: 15px; }
  .app-ic .desc { font-size: 12px; }
  .app-ic .bolha { min-width: 28px; height: 28px; font-size: 13px; }
  .topo { flex-wrap: wrap; }
  .ola .resumo { font-size: 13px; }
}

/* ---------- folhas (configurar a agenda) ---------- */
.fundo { position: fixed; inset: 0; z-index: 40; background: var(--fundo-escuro); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity .35s; }
.fundo.on { opacity: 1; }
.folha { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow: auto; background: var(--folha-bg); border: 1px solid var(--borda); border-radius: 30px 30px 0 0;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  transform: translateY(105%); transition: transform .55s var(--ease); box-shadow: 0 -20px 60px rgba(21, 32, 31, .15), var(--reflexo); }
.folha.on { transform: none; }
.folha:focus { outline: none; }
@media (min-width: 700px) { .folha { left: 50%; right: auto; bottom: 50%; width: 520px; border-radius: 30px; transform: translate(-50%, 60%) scale(.96); opacity: 0; transition: transform .5s var(--ease), opacity .3s; }
  .folha.on { transform: translate(-50%, 50%); opacity: 1; } }
.alca { width: 40px; height: 5px; border-radius: 3px; background: var(--borda2); margin: 0 auto 14px; }
.folha h3 { font-size: 22px; letter-spacing: -.03em; margin: 6px 2px 16px; }
.folha form { display: grid; gap: 8px; }
.folha label, .folha .rot { font-size: 13px; font-weight: 600; color: var(--suave); margin: 6px 2px 0; }
.campo { width: 100%; height: 50px; border-radius: 14px; border: 1px solid var(--borda2); background: var(--campo-bg); padding: 0 14px; font-size: 16px; outline: none; transition: border-color .2s, box-shadow .2s; }
.campo:focus { border-color: var(--pri2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--pri) 18%, transparent); }
.fim-folha { display: flex; gap: 10px; margin-top: 14px; }
.fim-folha button { flex: 1; height: 52px; border-radius: 16px; font-weight: 700; font-size: 16px; }
.b-salvar { background: var(--pri); color: #fff; }
.b-cancelar { background: var(--leve); border: 1px solid var(--borda2); }
.erro-f { color: var(--erro); font-size: 14px; min-height: 18px; }

/* ---------- entrada ---------- */
.entrada { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: var(--bg);
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.entrada::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60vmax 50vmax at 10% 0%, var(--brilho1), transparent 60%), radial-gradient(50vmax 40vmax at 100% 10%, var(--brilho2), transparent 60%), radial-gradient(50vmax 40vmax at 90% 100%, var(--brilho3), transparent 60%); }
.entrada-card { position: relative; width: min(380px, 100%); text-align: center; padding: 34px 26px 26px; border-radius: 32px; background: var(--vidro); border: 1px solid var(--vidro-borda);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: var(--sombra-forte), var(--reflexo); animation: surge .8s var(--ease) both; }
.entrada-card .g { width: 62px; height: 62px; margin: 0 auto 16px; object-fit: contain; }
.entrada-card h2 { font-size: 28px; letter-spacing: -.035em; }
.entrada-card p { color: var(--suave); font-size: 15px; margin-top: 6px; }
.entrada-card form { display: grid; gap: 10px; margin-top: 22px; text-align: left; }
.entrada-card .b-salvar { height: 52px; border-radius: 16px; font-weight: 700; }
.aviso { position: fixed; z-index: 80; left: 50%; top: max(16px, env(safe-area-inset-top, 0px)); transform: translate(-50%, calc(-100% - 40px)); visibility: hidden; background: var(--texto); color: var(--bg); padding: 12px 18px; border-radius: var(--pill);
  font-size: 14px; font-weight: 600; transition: transform .5s var(--spring), visibility 0s .5s; max-width: calc(100% - 32px); text-align: center; }
.aviso.on { transform: translate(-50%, 0); visibility: visible; transition: transform .5s var(--spring); }

/* ---------- busca rápida (Ctrl+K) ---------- */
.dica-k { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 14px; border-radius: var(--pill); background: var(--vidro); border: 1px solid var(--vidro-borda); font-size: 13px; font-weight: 600; color: var(--suave); }
.dica-k svg { width: 15px; height: 15px; }
.dica-k kbd, .busca-topo kbd { font: 600 12px var(--font); color: var(--apagado); border: 1px solid var(--borda2); border-radius: 7px; padding: 2px 7px; background: var(--forte); }
.busca { position: fixed; z-index: 61; left: 50%; top: max(12vh, 24px); width: min(560px, calc(100% - 32px)); transform: translate(-50%, -12px) scale(.97); opacity: 0; transition: transform .45s var(--spring), opacity .25s; background: var(--folha-bg); border: 1px solid var(--borda2); border-radius: 26px; box-shadow: var(--sombra-forte), var(--reflexo); overflow: hidden; }
.busca.on { transform: translate(-50%, 0) scale(1); opacity: 1; }
.busca-topo { display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 64px; border-bottom: 1px solid var(--borda); color: var(--suave); }
.busca-topo svg { width: 20px; height: 20px; flex: none; }
.busca-topo input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: none; font-size: 18px; color: var(--texto); }
.busca-lista { list-style: none; max-height: min(56vh, 420px); overflow: auto; padding: 8px; }
.busca-lista .grupo { font-size: 12px; font-weight: 700; color: var(--apagado); text-transform: uppercase; letter-spacing: .06em; padding: 10px 12px 6px; }
.busca-lista a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; }
.busca-lista a.on { background: var(--leve); }
.busca-lista .mini { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; box-shadow: none !important; }
.busca-lista .mini svg { width: 20px; height: 20px; }
.busca-lista .mini.acao { background: var(--leve); color: var(--texto); border: 1px solid var(--borda); }
.busca-lista b { display: block; font-size: 15px; font-weight: 700; }
.busca-lista small { display: block; font-size: 13px; color: var(--suave); }
.busca-lista .seta { margin-left: auto; color: var(--apagado); font-size: 12px; font-weight: 600; opacity: 0; white-space: nowrap; }
.busca-lista a.on .seta { opacity: 1; }
.busca-vazio { padding: 26px 12px; text-align: center; color: var(--suave); font-size: 14px; }
@media (max-width: 760px) { .dica-k kbd, .busca-topo kbd { display: none; } .dica-k { padding: 0 14px; } }

/* ---------- aba Agenda: agenda da equipe e reunião rápida ---------- */
.painel { margin-top: clamp(24px, 4vh, 40px); }
.painel-cab { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.painel-cab h2 { font-size: clamp(26px, 3vw, 34px); font-weight: 800; letter-spacing: -.04em; line-height: 1.1; }
.painel-cab p { color: var(--suave); font-size: 15px; margin-top: 4px; }
.painel-acoes { display: flex; align-items: center; gap: 10px; }
.seg { display: flex; padding: 4px; border-radius: var(--pill); background: var(--vidro); border: 1px solid var(--vidro-borda); box-shadow: var(--reflexo); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.seg button { height: 38px; padding: 0 16px; border-radius: var(--pill); font-size: 14px; font-weight: 600; color: var(--suave); transition: background .25s, color .25s; }
.seg button.on { background: var(--forte); color: var(--texto); box-shadow: 0 1px 3px rgba(21, 32, 31, .12); }
.painel-grade { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.lado-col { display: flex; flex-direction: column; gap: 20px; }
.agenda-card, .meet-card { border-radius: 30px; background: var(--vidro); border: 1px solid var(--vidro-borda); box-shadow: var(--sombra), var(--reflexo); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.agenda-card { padding: 10px; overflow: hidden; }
.ag-frame { display: block; width: 100%; height: 560px; border: 0; border-radius: 22px; background: #fff; }
.ag-rodape { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 10px 4px; }
.ag-pessoas { display: flex; flex-wrap: wrap; gap: 8px; }
.ag-pessoa { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: var(--pill); background: var(--forte); border: 1px solid var(--borda); font-size: 13px; font-weight: 600; }
.ag-pessoa i { width: 10px; height: 10px; border-radius: 50%; }
.ag-links { display: flex; gap: 16px; flex-wrap: wrap; }
.ag-links a { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--destaque); }
.ag-links svg { width: 16px; height: 16px; }
/* calendário do mês */
.cal { padding: 22px; }
.cal-cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
.cal-cab b { font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
.cal-nav { display: flex; gap: 8px; }
.cal-nav button { height: 40px; min-width: 40px; padding: 0 12px; border-radius: 12px; background: var(--forte); border: 1px solid var(--borda); font-weight: 600; font-size: 14px; display: grid; place-items: center; }
.cal-nav svg { width: 16px; height: 16px; }
.cal-sem, .cal-grade { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.cal-sem span { font-size: 12px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .06em; padding: 0 4px 6px; }
.cal-dia { min-height: 84px; border-radius: 16px; background: var(--forte); border: 1px solid var(--borda); padding: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 15px; font-weight: 700; transition: transform .3s var(--spring), border-color .2s; }
.cal-dia small { font-size: 11px; font-weight: 600; color: var(--acento); line-height: 1.2; }
:root:not([data-theme="dark"]) .cal-dia small { color: color-mix(in oklab, var(--acento) 75%, black); }
.cal-dia.fds { background: var(--leve); }
.cal-dia.fora { opacity: .4; }
.cal-dia.hoje { background: var(--pri); color: #fff; border-color: transparent; box-shadow: 0 10px 24px var(--brilho-marca); }
.cal-dia.hoje small { color: #fff !important; }
@media (hover: hover) { .cal-dia:hover { transform: translateY(-2px); border-color: var(--borda2); } }
.cal-aviso { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; padding: 14px 16px; border-radius: 18px; background: var(--leve); font-size: 14px; color: var(--suave); }
.cal-aviso .b-salvar { height: 44px; padding: 0 18px; border-radius: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.cal-aviso .b-salvar svg { width: 16px; height: 16px; }
.cal.mini { padding: 16px; }
.cal.mini .cal-cab b { font-size: 17px; }
.cal.mini .cal-sem, .cal.mini .cal-grade { gap: 5px; }
.cal.mini .cal-sem span { text-align: center; padding: 0 0 4px; }
.cal.mini .cal-dia { min-height: 0; aspect-ratio: 1; padding: 0; align-items: center; justify-content: center; font-size: 13px; border-radius: 11px; }
.cal.mini .cal-dia small { display: none; }
.cal.mini .cal-dia.feriado { box-shadow: inset 0 -3px 0 var(--acento); }
/* reunião rápida */
.meet-card { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.meet-topo { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.meet-ic { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; color: #fff; flex: none; }
.meet-ic svg { width: 28px; height: 28px; }
.meet-topo b { display: block; font-size: 18px; letter-spacing: -.02em; }
.meet-topo small { display: block; font-size: 13px; color: var(--suave); }
.meet-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 0 16px; border-radius: 16px; background: var(--forte); border: 1px solid var(--borda); font-size: 15px; font-weight: 600; text-align: center; }
.meet-btn svg { width: 18px; height: 18px; flex: none; }
.meet-btn.principal { background: var(--pri); border-color: transparent; color: #fff; font-weight: 700; box-shadow: 0 12px 28px var(--brilho-marca); }
@media (hover: hover) { .meet-btn:hover, .ag-links a:hover { filter: brightness(1.06); } .meet-btn:not(.principal):hover { border-color: var(--borda2); } }
.meet-sala { display: flex; gap: 8px; }
.meet-sala .meet-btn { flex: 1; }
.meet-copiar { width: 50px; flex: none; border-radius: 16px; background: var(--forte); border: 1px solid var(--borda); display: grid; place-items: center; }
.meet-copiar svg { width: 18px; height: 18px; }
.meet-nota { font-size: 12.5px; color: var(--apagado); text-align: center; margin-top: 2px; }
/* folha de configurar a agenda */
.ag-ajuda { font-size: 14px; color: var(--suave); line-height: 1.5; margin: 0 2px 6px; }
.ag-linha { display: grid; grid-template-columns: 40px minmax(0, .8fr) minmax(0, 1.4fr) 40px; gap: 8px; align-items: center; margin-bottom: 8px; }
.ag-linha .campo { height: 46px; font-size: 15px; }
.ag-cor { width: 40px; height: 40px; border-radius: 13px; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .55); }
.ag-tirar { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: var(--erro); }
.ag-tirar svg { width: 18px; height: 18px; }
.ag-mais { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 14px; border: 1px dashed var(--borda2); color: var(--destaque); font-weight: 600; justify-self: start; }
.ag-mais svg { width: 16px; height: 16px; }
@media (max-width: 900px) { .painel-grade { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .painel { margin-top: 28px; }
  .painel-acoes { width: 100%; justify-content: flex-end; }
  .painel-acoes .seg { margin-right: auto; }
  .ag-frame { height: 480px; border-radius: 18px; }
  .agenda-card, .meet-card { border-radius: 26px; }
  .cal { padding: 14px; }
  .cal-sem, .cal-grade { gap: 4px; }
  .cal-dia { min-height: 54px; padding: 6px; font-size: 13px; border-radius: 12px; }
  .cal-dia small { display: none; }
  .cal-dia.feriado { box-shadow: inset 0 -3px 0 var(--acento); }
  .ag-linha { grid-template-columns: 40px minmax(0, 1fr) 40px; }
  .ag-linha .ag-cor { grid-column: 1; grid-row: 1; }
  .ag-linha [data-campo="nome"] { grid-column: 2; grid-row: 1; }
  .ag-linha .ag-tirar { grid-column: 3; grid-row: 1; }
  .ag-linha [data-campo="id"] { grid-column: 1 / 4; grid-row: 2; }
}
/* ---------- escolhas em chips, chaves (liga/desliga) e campos lado a lado ---------- */
.opcoes { display: flex; flex-wrap: wrap; gap: 8px; }
.opcoes button { height: 40px; padding: 0 14px; border-radius: var(--pill); border: 1px solid var(--borda2); font-size: 14px; font-weight: 600; color: var(--suave); }
.opcoes button.on { background: var(--pri-claro); border-color: var(--pri2); color: var(--pri-texto); }
.duas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.duas > div { display: grid; gap: 8px; align-content: start; }
@media (max-width: 520px) { .duas { grid-template-columns: minmax(0, 1fr); } }
.secao { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--apagado); margin: 14px 2px 0; }
.ajuda { font-size: 13px; color: var(--suave); margin: 0 2px; line-height: 1.5; }
.chave-linha { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--campo-bg); border: 1px solid var(--borda2); cursor: pointer; }
.chave-linha b { display: block; font-size: 15px; }
.chave-linha small { display: block; font-size: 12.5px; color: var(--suave); }
.chave { position: relative; width: 50px; height: 30px; flex: none; }
.chave input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.chave i { position: absolute; inset: 0; border-radius: 15px; background: var(--borda2); transition: background .25s; pointer-events: none; }
.chave i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); transition: transform .3s var(--spring); }
.chave input:checked + i { background: var(--pri); }
.chave input:checked + i::after { transform: translateX(20px); }
.chave input:focus-visible + i { outline: 3px solid color-mix(in srgb, var(--pri) 50%, transparent); outline-offset: 2px; }
.campo-acao { display: flex; gap: 8px; }
.campo-acao .campo { flex: 1; min-width: 0; }
.b-mini { height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--borda2); background: var(--forte); font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.b-mini svg { width: 16px; height: 16px; }
.b-excluir { width: 100%; height: 48px; border-radius: 16px; color: var(--erro); font-weight: 600; margin-top: 4px; }
.b-novo { height: 42px; padding: 0 18px; border-radius: var(--pill); background: var(--pri); color: #fff; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 10px 24px var(--brilho-marca); white-space: nowrap; }
.b-novo svg { width: 16px; height: 16px; }

/* ---------- aba Colaboradores ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
.kpi { border-radius: 24px; padding: 18px 20px; background: var(--vidro); border: 1px solid var(--vidro-borda); box-shadow: var(--sombra), var(--reflexo); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); animation: surge .7s var(--ease) both; min-width: 0; }
.kpi small { display: block; font-size: 13px; font-weight: 600; color: var(--suave); }
.kpi b { display: block; font-size: 28px; font-weight: 800; letter-spacing: -.04em; margin-top: 4px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi p { font-size: 12.5px; color: var(--suave); margin-top: 4px; }
.kpi.destaque { background: var(--widget2-bg); border-color: transparent; color: var(--widget2-txt); }
.kpi.destaque small, .kpi.destaque p { color: var(--widget2-sub); }
.colabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.colab { position: relative; display: flex; flex-direction: column; gap: 14px; width: 100%; text-align: left; border-radius: 26px; padding: 18px; background: var(--vidro); border: 1px solid var(--vidro-borda); box-shadow: var(--sombra), var(--reflexo); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); transition: transform .4s var(--spring), border-color .2s; animation: surge .7s var(--ease) both; animation-delay: var(--d, 0s); }
@media (hover: hover) { .colab:hover { transform: translateY(-3px); border-color: var(--borda2); } }
.colab.inativo { opacity: .62; }
.colab-topo { display: flex; align-items: center; gap: 12px; padding-right: 34px; }
.avatar { width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; flex: none; background: var(--av, var(--pri)); }
.colab-nome { min-width: 0; flex: 1; }
.colab-nome b, .colab-nome small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.colab-nome b { font-size: 16px; }
.colab-nome small { font-size: 13px; color: var(--suave); }
.pos { position: absolute; top: 16px; right: 16px; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; display: grid; place-items: center; font-size: 12.5px; font-weight: 800; background: var(--leve); color: var(--suave); }
.pos.p1 { background: color-mix(in oklab, var(--acento) 28%, transparent); color: color-mix(in oklab, var(--acento) 70%, var(--texto)); }
.colab-venda b { font-size: 26px; font-weight: 800; letter-spacing: -.04em; }
.colab-venda small { font-size: 13px; color: var(--suave); margin-left: 6px; }
.barra { height: 8px; border-radius: 4px; background: var(--leve); overflow: hidden; }
.barra i { display: block; height: 100%; width: var(--p, 0%); border-radius: 4px; background: linear-gradient(90deg, var(--pri2), var(--pri)); }
.colab-pe { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--suave); }
.colab-pe span { display: inline-flex; align-items: center; gap: 6px; }
.selo { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: var(--pill); white-space: nowrap; }
.selo.ok { background: var(--ok-bg); color: var(--ok); }
.selo.sem { background: var(--leve); color: var(--suave); }
.selo.off { background: var(--atencao-bg); color: var(--atencao); }
.aviso-linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 16px; padding: 12px 16px; border-radius: 18px; background: var(--atencao-bg); color: var(--atencao); font-size: 14px; font-weight: 600; }
.aviso-linha a { text-decoration: underline; text-underline-offset: 3px; }
.vazio-card { text-align: center; padding: 44px 22px; border-radius: 30px; background: var(--vidro); border: 1px solid var(--vidro-borda); box-shadow: var(--sombra), var(--reflexo); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.vazio-card .ic { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 22px; display: grid; place-items: center; color: #fff; }
.vazio-card .ic svg { width: 30px; height: 30px; }
.vazio-card h3 { font-size: 22px; letter-spacing: -.03em; }
.vazio-card p { color: var(--suave); font-size: 15px; max-width: 440px; margin: 6px auto 20px; }
.carregando-c { padding: 40px; text-align: center; color: var(--suave); }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) {
  .colabs { grid-template-columns: minmax(0, 1fr); }
  .kpi { padding: 14px 16px; border-radius: 20px; }
  .kpi b { font-size: 22px; }
  .painel-acoes { flex-wrap: wrap; }
  .painel-acoes .b-novo { margin-left: auto; }
}

/* ---------- ficha do colaborador, acesso criado e conta ---------- */
.ficha-topo { display: flex; align-items: center; gap: 14px; margin: 4px 2px 16px; }
.ficha-topo .avatar { width: 56px; height: 56px; border-radius: 18px; font-size: 18px; }
.ficha-topo b { display: block; font-size: 20px; letter-spacing: -.02em; }
.ficha-topo small { display: block; font-size: 13.5px; color: var(--suave); }
.mini-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mini-kpis div { padding: 12px; border-radius: 16px; background: var(--campo-bg); min-width: 0; }
.mini-kpis small { display: block; font-size: 12px; color: var(--suave); font-weight: 600; }
.mini-kpis b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lista-simples { list-style: none; display: grid; gap: 6px; }
.lista-simples li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--campo-bg); font-size: 14px; }
.lista-simples li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lista-simples li small { color: var(--suave); }
.lista-simples li b { white-space: nowrap; }
.contatos { display: grid; gap: 6px; }
.contatos > a, .contatos > span { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 4px 2px; }
.contatos svg { width: 16px; height: 16px; color: var(--suave); flex: none; }
.contatos a { color: var(--destaque); font-weight: 600; }
.credenciais { display: grid; gap: 4px; padding: 14px 16px; border-radius: 16px; background: var(--pri-claro); color: var(--pri-texto); font-size: 15px; }
.credenciais b { font-weight: 800; }
.credenciais code { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
.item-conta { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; border-radius: 16px; background: var(--campo-bg); border: 1px solid var(--borda); font-weight: 600; font-size: 15px; text-align: left; }

  };

  // ---------- endereços ----------
  // O CRM mora no mesmo site do hub, em /crm/ (mesmo login).
  const CRM = '/crm/', CRM_QUADRO = '/crm/quadro.html', CRM_NOVO = '/crm/quadro.html?novo=1',
        CRM_FOLLOW = '/crm/followups.html', CRM_RESPONDEU = '/crm/quadro.html#col-respondeu', CRM_LEADS = '/crm/leads.html';
  const MEET_NOVA = 'https://meet.google.com/new';
  const AGENDA_GOOGLE = 'https://calendar.google.com/calendar/r';
  const AGENDA_NOVO = 'https://calendar.google.com/calendar/r/eventedit';
  const ehCrm = u => /^\/crm(\/|$)/.test(String(u || ''));
  const ehExterno = u => /^https?:\/\//i.test(u) && !u.includes(location.host);
  const alvo = u => ehExterno(u) ? ' target="_blank" rel="noopener"' : '';

  // ferramentas da tela inicial (a Agenda e os Colaboradores ficam só na barra lateral)
  const FERRAMENTAS = [
    { id: 'crm', nome: 'CRM', desc: 'Leads e follow-ups', url: CRM, icone: 'pessoas', cor: 'marca' }
  ];

  // ---------- quem está logado ----------
  let EU = null; // { nome, usuario, papel, cargo }
  const ehAdmin = () => !!EU && EU.papel === 'admin';

  // ---------- servidor (api.php); sem servidor vira exemplo guardado neste navegador ----------
  let DEMO = false, numeros = {}, falouComServidor = false;
  const mostrado = {}; // números já mostrados nos widgets (para animar só a diferença)
  const calmo = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  async function api(acao, dados = {}) {
    if (DEMO) return demo(acao, dados);
    let r;
    try {
      r = await fetch('/api.php?acao=' + acao, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados) });
    } catch (e) {
      // se o servidor já respondeu antes, foi só a internet piscando: avisa em vez de cair no modo exemplo
      if (falouComServidor) { const x = new Error('Sem conexão com o servidor. Tente de novo em instantes.'); x.status = 0; throw x; }
      DEMO = true; return demo(acao, dados);
    }
    if (!(r.headers.get('content-type') || '').includes('json')) {
      if (falouComServidor) { const x = new Error('O servidor respondeu algo inesperado. Recarregue a página.'); x.status = r.status; throw x; }
      DEMO = true; return demo(acao, dados);
    }
    falouComServidor = true;
    const j = await r.json();
    if (!r.ok) { const e = new Error(j.erro || 'Algo deu errado.'); e.status = r.status; throw e; }
    return j;
  }

  // ---------- modo exemplo (sem servidor): tudo fica neste navegador ----------
  const ADMIN_DEMO = { nome: 'Lopes', usuario: 'lopes', papel: 'admin', cargo: 'Administrador' };
  function colabsDemo() {
    try { const l = JSON.parse(lerGuardado('demo-colab') || 'null'); if (Array.isArray(l)) return l; } catch (e) {}
    const dia = 86400000, iso = d => new Date(Date.now() - d * dia).toISOString();
    const l = [
      { id: 1, nome: 'Ana Paula Souza', cargo: 'Corretor', telefone: '(34) 99812-4410', email: '', creci: '12345-F', ativo: true, acesso: true, usuario: 'ana', ultimo_acesso: iso(.1), vendas: 2, vendido: 870000, andamento: 9, visitas: 2 },

  }
  function demo(acao, x) {
    const falha = (msg, status = 400) => { throw Object.assign(new Error(msg), { status }); };
    const logado = lerGuardado('demo-logado') === '1';
    if (acao === 'sessao') return { logado, usuario: logado ? ADMIN_DEMO : null };
    if (acao === 'entrar') { guardar('demo-logado', '1'); return { ok: true, usuario: ADMIN_DEMO }; }
    if (acao === 'sair') { guardar('demo-logado', null); return { ok: true }; }
    if (!logado) falha('Entre de novo com seu usuário e senha.', 401);
    const lista = colabsDemo(), salvarLista = l => guardar('demo-colab', JSON.stringify(l));
    if (acao === 'dados') return { usuario: ADMIN_DEMO, numeros: { crm: { novos: 4, responderam: 2, atrasados: 1, hoje: 3 }, vendas: { vendas: 3, total: 1160000 } } };
    if (acao === 'colaboradores') {
      const fator = { mes: 1, '90': 2, ano: 4, tudo: 6 }[x.periodo] || 1;
      const cs = lista.map(c => ({ ...c, vendas: c.vendas * fator, vendido: c.vendido * fator }));
      const t = cs.reduce((a, c) => ({ vendas: a.vendas + c.vendas, vendido: a.vendido + c.vendido, andamento: a.andamento + c.andamento }), { vendas: 0, vendido: 0, andamento: 0 });

    if (acao === 'colaborador') {
      const c = lista.find(c => c.id === Number(x.id)) || falha('Colaborador não encontrado.', 404);
      const vendas = Array.from({ length: c.vendas }, (_, i) => ({ id: i + 1, nome: ['Lucas Ferreira', 'Renata Gomes', 'João Pedro'][i % 3], valor: c.vendido / c.vendas, empreendimento: '', em: new Date(Date.now() - (i * 9 + 2) * 86400000).toISOString() }));
      return { colaborador: c, vendas };
    }
    if (acao === 'colaborador_salvar') {
      const nome = String(x.nome || '').trim(), usuario = String(x.usuario || '').trim().toLowerCase();
      if (!nome) falha('Informe o nome do colaborador.');
      if (lista.some(c => c.nome.toLowerCase() === nome.toLowerCase() && c.id !== Number(x.id))) falha('Já existe alguém cadastrado com esse nome. Use o nome completo para diferenciar.');
      if (x.acesso && !/^[a-z0-9._-]{3,40}$/.test(usuario)) falha('O usuário precisa ter de 3 a 40 letras, números, ponto, hífen ou sublinhado (sem espaço nem acento).');
      if (x.acesso && (usuario === 'lopes' || lista.some(c => c.usuario === usuario && c.id !== Number(x.id)))) falha('Esse usuário já está em uso. Escolha outro.');
      if (x.acesso && x.senha && String(x.senha).length < 6) falha('A senha precisa ter pelo menos 6 caracteres.');
      const atual = lista.find(c => c.id === Number(x.id));
      if (x.acesso && !x.senha && !(atual && atual.acesso)) falha('Crie uma senha para o acesso.');
      const dadosC = { nome, cargo: x.cargo || 'Corretor', telefone: x.telefone || '', email: x.email || '', creci: x.creci || '', ativo: x.ativo !== false, acesso: !!x.acesso, usuario: x.acesso ? usuario : (atual ? atual.usuario : '') };
      if (atual) { Object.assign(atual, dadosC); salvarLista(lista); return { id: atual.id }; }
      const id = Math.max(0, ...lista.map(c => c.id)) + 1;
      lista.push({ id, ...dadosC, ultimo_acesso: null, vendas: 0, vendido: 0, andamento: 0, visitas: 0 }); salvarLista(lista);
      return { id };
    }
    if (acao === 'colaborador_excluir') { salvarLista(lista.filter(c => c.id !== Number(x.id))); return { ok: true }; }
    if (acao === 'senha_trocar') { if (String(x.nova || '').length < 6) falha('A senha nova precisa ter pelo menos 6 caracteres.'); return { ok: true }; }
    return { ok: true };

    if (!iso) return '';

  // ---------- folha (janela que sobe de baixo no celular e aparece no meio no computador) ----------
  function abrirFolha(rotulo, html) {
    const fundo = document.createElement('div'); fundo.className = 'fundo';
    const fl = document.createElement('div'); fl.className = 'folha'; fl.setAttribute('role', 'dialog'); fl.setAttribute('aria-modal', 'true'); fl.setAttribute('aria-label', rotulo);

  const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

    document.body.append(fundo, cx);
    requestAnimationFrame(() => { fundo.classList.add('on'); cx.classList.add('on'); });
    const q = $('#b-q', cx), ul = $('#b-lista', cx), antesFoco = document.activeElement, ACOES = acoesBusca();

    const executar = it => {

      const t = semAcento(q.value.trim());

      const fs = FERRAMENTAS.filter(bate).map(f => ({ ...f, tipo: 'f' }));
      const as = ACOES.filter(bate).map(a => ({ ...a, tipo: 'a' }));
      itens = [...fs, ...as]; sel = Math.min(sel, Math.max(itens.length - 1, 0));
      if (!itens.length) { ul.innerHTML = `<li class="busca-vazio">Nada encontrado para “${esc(q.value)}”</li>`; return; }
      const linha = (it, i) => `<li><a href="${it.url ? esc(it.url) : '#'}" data-i="${i}" role="option" aria-selected="${i === sel}" class="${i === sel ? 'on' : ''}">${it.tipo === 'f' ? `<span class="mini cor-${esc(it.cor)}">${svg(IC[it.icone], 1.9)}</span>` : `<span class="mini acao">${svg(it.i)}</span>`}<span><b>${esc(it.nome)}</b><small>${esc(it.desc || it.url)}</small></span><span class="seta">Enter ↵</span></a></li>`;
      ul.innerHTML = (fs.length ? '<li class="grupo">Ferramentas</li>' + fs.map((it, i) => linha(it, i)).join('') : '') + (as.length ? '<li class="grupo">Ações</li>' + as.map((it, i) => linha(it, fs.length + i)).join('') : '');
      $$('a', ul).forEach(a => {
        a.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); executar(itens[+a.dataset.i]); });
        a.addEventListener('mousemove', () => { if (sel !== +a.dataset.i) { sel = +a.dataset.i; marcar(); } });
      });

    q.addEventListener('input', () => { sel = 0; pintar(); });
    q.addEventListener('keydown', e => {
      const n = Math.max(itens.length, 1);
      if (e.key === 'ArrowDown') { e.preventDefault(); sel = (sel + 1) % n; marcar(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); sel = (sel - 1 + n) % n; marcar(); }

  // calendário do mês: semana começa na segunda, com os feriados nacionais; tocar num dia cria um compromisso no Google Agenda
  const FERIADOS = { '1-1': 'Confraternização Universal', '4-21': 'Tiradentes', '5-1': 'Dia do Trabalho', '9-7': 'Independência', '10-12': 'Nossa Senhora Aparecida', '11-2': 'Finados', '11-15': 'Proclamação da República', '11-20': 'Consciência Negra', '12-25': 'Natal' };
  function pascoa(ano) {
    const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    return new Date(ano, Math.floor((h + l - 7 * m + 114) / 31) - 1, (h + l - 7 * m + 114) % 31 + 1);
  }
  function feriado(dt) {
    const fixo = FERIADOS[(dt.getMonth() + 1) + '-' + dt.getDate()];

    return { '-47': 'Carnaval', '-2': 'Sexta-feira Santa', '60': 'Corpus Christi' }[dias] || '';
  }
  let calMes = new Date(); calMes.setDate(1);

        ? `<div class="meet-sala"><a class="meet-btn tap" href="${esc(sala)}" target="_blank" rel="noopener">${svg(IC.pessoas, 2)} Sala da equipe</a><button type="button" class="meet-copiar tap" id="meet-copiar" aria-label="Copiar o link da sala">${svg(IC.copiar, 2)}</button></div>`
        : `<button type="button" class="meet-btn tap" id="meet-definir">${svg(IC.pessoas, 2)} Definir a sala fixa da equipe</button>`}
      <p class="meet-nota">Abre com a conta Google conectada neste navegador.</p>`;
    const cp = $('#meet-copiar');
    if (cp) cp.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(sala); avisar('Link da sala copiado'); } catch (e) { avisar('Não consegui copiar o link'); }
    });
    const df = $('#meet-definir');
    if (df) df.addEventListener('click', () => configurarAgenda('sala'));
  }
  function configurarAgenda(foco) {
    const rascunho = agenda.pessoas.map(p => ({ ...p }));
    if (!rascunho.length) rascunho.push({ nome: '', id: '', cor: CORES_AGENDA[0] });
    const linhas = () => rascunho.map((p, i) => `<div class="ag-linha" data-i="${i}">
        <button type="button" class="ag-cor tap" data-cor="${i}" style="background:${esc(p.cor)}" aria-label="Trocar a cor de ${esc(p.nome || 'pessoa ' + (i + 1))}"></button>
        <input class="campo" data-campo="nome" value="${esc(p.nome)}" placeholder="Nome" aria-label="Nome da pessoa ${i + 1}" autocomplete="off">
        <input class="campo" data-campo="id" value="${esc(p.id)}" placeholder="E-mail ou ID da agenda" aria-label="ID da agenda da pessoa ${i + 1}" inputmode="email" autocapitalize="off" autocomplete="off">
        <button type="button" class="ag-tirar tap" data-tirar="${i}" aria-label="Tirar ${esc(p.nome || 'esta pessoa')}">${svg(IC.lixo, 2)}</button>
      </div>`).join('');
    const { fl, fechar } = abrirFolha('Configurar a agenda', `<h3>Agenda da equipe</h3>
      <form id="f-ag" novalidate>
        <p class="ag-ajuda">No Google Agenda, abra <b>Configurações</b>, clique na agenda do corretor e copie o <b>ID da agenda</b> (em "Integrar agenda"). Para aparecer aqui, a agenda precisa estar compartilhada com a conta Google aberta neste navegador.</p>
        <span class="rot">Corretores e equipe</span>
        <div id="ag-linhas">${linhas()}</div>
        <button type="button" class="ag-mais tap" id="ag-mais">${svg(IC.mais, 2.4)} Adicionar pessoa</button>
        <label for="ag-sala">Sala fixa do Meet (opcional)</label>
        <input class="campo" id="ag-sala" value="${esc(agenda.sala || '')}" placeholder="https://meet.google.com/abc-defg-hij" inputmode="url" autocapitalize="off" autocomplete="off">
        <p class="erro-f" id="ag-erro" role="alert"></p>
        <div class="fim-folha"><button type="button" class="b-cancelar tap" id="ag-cancelar">Cancelar</button><button class="b-salvar tap">Salvar</button></div>
      </form>`);
    $('#ag-cancelar', fl).addEventListener('click', fechar);
    fl.addEventListener('input', () => { $('#ag-erro', fl).textContent = ''; });
    const ler = () => $$('.ag-linha', fl).forEach(l => { const p = rascunho[+l.dataset.i]; p.nome = $('[data-campo="nome"]', l).value.trim(); p.id = $('[data-campo="id"]', l).value.trim(); });
    const redesenha = () => { $('#ag-linhas', fl).innerHTML = linhas(); };
    $('#ag-linhas', fl).addEventListener('click', e => {
      const cor = e.target.closest('[data-cor]'), tirar = e.target.closest('[data-tirar]');
      if (!cor && !tirar) return;
      ler();
      if (cor) { const p = rascunho[+cor.dataset.cor]; p.cor = CORES_AGENDA[(CORES_AGENDA.indexOf(p.cor) + 1) % CORES_AGENDA.length]; }
      if (tirar) rascunho.splice(+tirar.dataset.tirar, 1);
      redesenha();
    });
    $('#ag-mais', fl).addEventListener('click', () => {
      ler();
      rascunho.push({ nome: '', id: '', cor: CORES_AGENDA[rascunho.length % CORES_AGENDA.length] });
      redesenha();
      const nomes = $$('.ag-linha [data-campo="nome"]', fl);
      nomes[nomes.length - 1].focus();
    });
    setTimeout(() => { const f = foco === 'sala' ? $('#ag-sala', fl) : $('.ag-linha [data-campo="id"]', fl); if (f) f.focus(); }, 350);
    $('#f-ag', fl).addEventListener('submit', e => {
      e.preventDefault();
      ler();
      const erro = $('#ag-erro', fl), pessoas = rascunho.filter(p => p.id);
      const ruim = pessoas.find(p => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.id));
      if (ruim) { erro.textContent = `"${ruim.id}" não parece um ID de agenda. Use o e-mail da pessoa ou o ID que termina em @group.calendar.google.com.`; return; }
      const sala = $('#ag-sala', fl).value.trim();
      if (sala && !/^https:\/\/meet\.google\.com\/[a-z0-9-]+/i.test(sala)) { erro.textContent = 'O link da sala precisa começar com https://meet.google.com/'; return; }
      agenda.pessoas = pessoas.map(p => ({ nome: p.nome || p.id.split('@')[0], id: p.id, cor: p.cor }));
      agenda.sala = sala;
      guardarAgenda(); pintarAgenda(); fechar();
      avisar(pessoas.length ? 'Agenda conectada' : 'Agenda salva');
    });
  }
  $('#ag-config').innerHTML = svg(IC.engrenagem);
  $('#ag-config').addEventListener('click', () => configurarAgenda());
  $$('#ag-modo button').forEach(b => b.addEventListener('click', () => { agenda.modo = b.dataset.modo; guardarAgenda(); pintarAgenda(); }));

  // ---------- colaboradores (só o administrador): cadastro, acesso ao hub e vendas de cada um ----------
  const CARGOS = ['Corretor', 'Gerente', 'Captador', 'Secretária', 'Financeiro', 'Outro'];
  const PERIODOS = [['mes', 'Este mês'], ['90', '90 dias'], ['ano', 'Este ano'], ['tudo', 'Tudo']];
  const NO_PERIODO = { mes: 'no mês', '90': 'em 90 dias', ano: 'no ano', tudo: 'desde o início' };
  const colab = { periodo: ['mes', '90', 'ano', 'tudo'].includes(lerGuardado('colab-periodo')) ? lerGuardado('colab-periodo') : 'mes', lista: null, resumo: null };

  async function carregarColaboradores() {
    if (!ehAdmin()) return;
    pintarPeriodo();
    try {
      const r = await api('colaboradores', { periodo: colab.periodo });
      colab.lista = r.colaboradores; colab.resumo = r.resumo;
      pintarColaboradores();
    } catch (e) { if (e.status === 401) return entrada(); avisar(e.message); }
  }
  function pintarPeriodo() {
    $('#colab-periodo').innerHTML = PERIODOS.map(([k, t]) => `<button type="button" data-p="${k}" class="${k === colab.periodo ? 'on' : ''}" aria-pressed="${k === colab.periodo}">${t}</button>`).join('');
  }
  $('#colab-periodo').addEventListener('click', e => {
    const b = e.target.closest('[data-p]'); if (!b || b.dataset.p === colab.periodo) return;
    colab.periodo = b.dataset.p; guardar('colab-periodo', colab.periodo);
    carregarColaboradores();
  });
  $('#colab-novo').innerHTML = svg(IC.mais, 2.4) + ' Novo colaborador';
  $('#colab-novo').addEventListener('click', () => editarColab(null));

  function pintarColaboradores() {
    const corpo = $('#colab-corpo'), lista = colab.lista || [], r = colab.resumo || {}, np = NO_PERIODO[colab.periodo];
    if (!lista.length) {
      corpo.innerHTML = `<div class="vazio-card"><span class="ic cor-marca">${svg(IC.equipe, 1.9)}</span>
        <h3>Cadastre a sua equipe</h3>
        <p>Coloque aqui os corretores e quem mais trabalha com você. Cada um pode ganhar um usuário e senha para entrar no hub, e as vendas do CRM aparecem por corretor.</p>
        <button type="button" class="b-novo tap" id="colab-novo2">${svg(IC.mais, 2.4)} Cadastrar o primeiro</button></div>`;
      $('#colab-novo2').addEventListener('click', () => editarColab(null));
      return;
    }
    const ativos = lista.filter(c => c.ativo), comAcesso = ativos.filter(c => c.acesso).length;
    const ordem = [...lista].sort((a, b) => (b.ativo - a.ativo) || (b.vendido - a.vendido) || (b.vendas - a.vendas) || a.nome.localeCompare(b.nome, 'pt-BR'));
    const topo = Math.max(...ordem.map(c => c.vendido), 0);
    let pos = 0;
    const ticket = r.vendas ? r.vendido / r.vendas : 0;
    corpo.innerHTML = `<div class="kpis">
        <div class="kpi destaque"><small>Vendido ${np}</small><b class="num">${brlCurto(r.vendido)}</b><p>${plural(r.vendas || 0, 'venda', 'vendas')} da equipe</p></div>
        <div class="kpi" style="animation-delay:.05s"><small>Ticket médio</small><b class="num">${ticket ? brlCurto(ticket) : '—'}</b><p>por venda ${np}</p></div>
        <div class="kpi" style="animation-delay:.1s"><small>Leads em andamento</small><b class="num">${r.andamento || 0}</b><p>no funil do CRM agora</p></div>
        <div class="kpi" style="animation-delay:.15s"><small>Equipe ativa</small><b class="num">${ativos.length}</b><p>${comAcesso} com acesso ao hub</p></div>
      </div>
      <div class="colabs">${ordem.map((c, i) => {
        const nPos = c.ativo && c.vendido > 0 ? ++pos : 0;
        const selo = !c.ativo ? '<span class="selo sem">Inativo</span>' : c.acesso ? '<span class="selo ok">Com acesso</span>' : '<span class="selo off">Sem acesso</span>';
        const visto = c.ativo && c.acesso ? (c.ultimo_acesso ? 'entrou ' + haQuanto(c.ultimo_acesso) : 'ainda não entrou') : '';
        return `<button type="button" class="colab${c.ativo ? '' : ' inativo'}" data-colab="${c.id}" style="--d:${.05 + i * .04}s" aria-label="${esc(c.nome)}: ${esc(brl(c.vendido))} vendidos ${np}">
          ${nPos ? `<span class="pos${nPos === 1 ? ' p1' : ''}" title="${nPos}º em vendas ${np}">${nPos}º</span>` : ''}
          <span class="colab-topo"><span class="avatar" style="--av:${corDe(c.nome)}">${esc(iniciaisDe(c.nome))}</span><span class="colab-nome"><b>${esc(c.nome)}</b><small>${esc(c.cargo)}${c.creci ? ' · CRECI ' + esc(c.creci) : ''}</small></span></span>
          <span class="colab-venda"><b class="num">${brl(c.vendido)}</b><small>${plural(c.vendas, 'venda', 'vendas')} ${np}</small></span>
          <span class="barra" aria-hidden="true"><i style="--p:${topo ? Math.max(2, Math.round(c.vendido * 100 / topo)) : 0}%"></i></span>
          <span class="colab-pe"><span>${selo}${visto ? ' ' + esc(visto) : ''}</span><span>${plural(c.andamento, 'lead em andamento', 'leads em andamento')}</span></span>
        </button>`;
      }).join('')}</div>
      ${r.sem_responsavel && r.sem_responsavel.vendas ? `<div class="aviso-linha"><span>${plural(r.sem_responsavel.vendas, 'venda', 'vendas')} ${np} (${brl(r.sem_responsavel.vendido)}) sem corretor no CRM. Defina o responsável no lead para contar aqui.</span><a href="${CRM_LEADS}?etapa=venda">Ver no CRM</a></div>` : ''}`;
    $$('[data-colab]', corpo).forEach(b => b.addEventListener('click', () => abrirColab(Number(b.dataset.colab))));
  }

  // Ficha do colaborador: números, contatos e últimas vendas
  async function abrirColab(id) {
    const c0 = (colab.lista || []).find(c => c.id === id);
    if (!c0) return;
    const f = abrirFolha('Colaborador ' + c0.nome, `<p class="carregando-c">Carregando…</p>`);
    let r;
    try { r = await api('colaborador', { id }); } catch (e) { f.fechar(); if (e.status === 401) return entrada(); return avisar(e.message); }
    const c = { ...c0, ...r.colaborador }, np = NO_PERIODO[colab.periodo];
    f.trocar(`<div class="ficha-topo"><span class="avatar" style="--av:${corDe(c.nome)}">${esc(iniciaisDe(c.nome))}</span><div><b>${esc(c.nome)}</b><small>${esc(c.cargo)}${c.creci ? ' · CRECI ' + esc(c.creci) : ''}${c.ativo ? '' : ' · inativo'}</small></div></div>
      <div class="mini-kpis"><div><small>Vendido ${np}</small><b>${brlCurto(c0.vendido)}</b></div><div><small>Vendas ${np}</small><b>${c0.vendas}</b></div><div><small>Em andamento</small><b>${c0.andamento}</b></div></div>
      <p class="secao">Contato e acesso</p>
      <div class="contatos">
        ${c.telefone ? `<a href="${esc(wa(c.telefone))}" target="_blank" rel="noopener">${svg(IC.whats)}${esc(c.telefone)}</a>` : ''}
        ${c.email ? `<a href="mailto:${esc(c.email)}">${svg(IC.email)}${esc(c.email)}</a>` : ''}
        <span>${svg(IC.chave)}<span>${c.acesso ? `Entra no hub com o usuário <b>${esc(c.usuario)}</b>${c.ultimo_acesso ? ' · último acesso ' + esc(haQuanto(c.ultimo_acesso)) : ' · ainda não entrou'}` : 'Sem acesso ao hub'}</span></span>
      </div>
      <p class="secao">Últimas vendas</p>
      ${r.vendas.length ? `<ul class="lista-simples">${r.vendas.map(v => `<li><span>${esc(v.nome || 'Lead')}${v.empreendimento ? ` <small>· ${esc(v.empreendimento)}</small>` : ''}</span><span><b>${v.valor != null ? esc(brl(v.valor)) : 'sem valor'}</b> <small>${esc(new Date(v.em).toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' }))}</small></span></li>`).join('')}</ul>`
        : '<p class="ajuda">Nenhuma venda com o nome dele no CRM ainda. Quando um lead dele virar venda, aparece aqui.</p>'}
      <div class="fim-folha"><button type="button" class="b-cancelar tap" data-f="fechar">Fechar</button><button type="button" class="b-salvar tap" data-f="editar">Editar dados e acesso</button></div>`);
    f.fl.addEventListener('click', e => {
      const b = e.target.closest('[data-f]'); if (!b) return;
      if (b.dataset.f === 'fechar') f.fechar();
      if (b.dataset.f === 'editar') formColab(f, c);
    });
  }

  // Novo colaborador (c = null) ou editar
  function editarColab(c) { formColab(abrirFolha(c ? 'Editar ' + c.nome : 'Novo colaborador', ''), c); }
  const sugerirUsuario = nome => { const p = semAcento(nome).replace(/[^a-z0-9\s]/g, '').trim().split(/\s+/).filter(Boolean); return p.length ? (p.length > 1 ? p[0] + '.' + p[p.length - 1] : p[0]).slice(0, 40) : ''; };
  const gerarSenha = () => { const a = 'abcdefghjkmnpqrstuvwxyz23456789', b = new Uint32Array(8); crypto.getRandomValues(b); return [...b].map(n => a[n % a.length]).join(''); };
  function formColab(f, c) {
    const nova = !c;
    const d = c ? { ...c } : { nome: '', cargo: 'Corretor', telefone: '', email: '', creci: '', ativo: true, acesso: true, usuario: '' };
    let usuarioMexido = !!d.usuario;
    f.trocar(`<h3>${nova ? 'Novo colaborador' : 'Editar ' + esc(d.nome)}</h3>
      <form id="f-colab" novalidate autocomplete="off">
        <label for="cb-nome">Nome completo</label><input class="campo" id="cb-nome" value="${esc(d.nome)}" maxlength="80" placeholder="Ana Paula Souza" autocomplete="off">
        <span class="rot">Cargo</span>
        <div class="opcoes" id="cb-cargo">${CARGOS.map(k => `<button type="button" data-c="${k}" class="${k === d.cargo ? 'on' : ''}" aria-pressed="${k === d.cargo}">${k}</button>`).join('')}</div>
        <div class="duas">
          <div><label for="cb-tel">Telefone / WhatsApp</label><input class="campo" id="cb-tel" value="${esc(d.telefone)}" inputmode="tel" placeholder="(34) 99999-0000" autocomplete="off"></div>
          <div><label for="cb-creci">CRECI</label><input class="campo" id="cb-creci" value="${esc(d.creci)}" placeholder="opcional" autocomplete="off"></div>
        </div>
        <label for="cb-email">E-mail</label><input class="campo" id="cb-email" value="${esc(d.email)}" inputmode="email" autocapitalize="off" placeholder="opcional" autocomplete="off">
        <p class="secao">Acesso ao hub</p>
        <label class="chave-linha" for="cb-acesso"><span><b>Pode entrar no hub</b><small>Com usuário e senha próprios. Sem acesso, só aparece no CRM como responsável.</small></span><span class="chave"><input type="checkbox" id="cb-acesso"${d.acesso ? ' checked' : ''}><i></i></span></label>
        <div id="cb-acesso-campos" style="display:grid;gap:8px"${d.acesso ? '' : ' hidden'}>
          <label for="cb-usuario">Usuário</label><input class="campo" id="cb-usuario" value="${esc(d.usuario)}" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ana.souza" maxlength="40" autocomplete="off">
          <label for="cb-senha">${nova || !c.acesso ? 'Senha' : 'Nova senha'}</label>
          <div class="campo-acao"><input class="campo" id="cb-senha" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="new-password" placeholder="${nova || !c.acesso ? 'mínimo 6 caracteres' : 'deixe em branco para manter'}" maxlength="80"><button type="button" class="b-mini tap" id="cb-gerar">${svg(IC.chave)} Gerar</button></div>
        </div>
        ${nova ? '' : `<label class="chave-linha" for="cb-ativo" style="margin-top:6px"><span><b>Ativo</b><small>Inativo não entra no hub e some da lista de corretores do CRM. As vendas dele continuam no histórico.</small></span><span class="chave"><input type="checkbox" id="cb-ativo"${d.ativo ? ' checked' : ''}><i></i></span></label>`}
        <p class="erro-f" id="cb-erro" role="alert"></p>
        <div class="fim-folha"><button type="button" class="b-cancelar tap" id="cb-cancelar">Cancelar</button><button class="b-salvar tap" id="cb-ok">${nova ? 'Cadastrar' : 'Salvar'}</button></div>
        ${nova ? '' : '<button type="button" class="b-excluir" id="cb-excluir">Excluir cadastro</button>'}
      </form>`);
    const fl = f.fl, erro = $('#cb-erro', fl);
    setTimeout(() => $('#cb-nome', fl).focus(), 350);
    fl.addEventListener('input', () => { erro.textContent = ''; });
    $('#cb-cancelar', fl).addEventListener('click', f.fechar);
    $$('#cb-cargo button', fl).forEach(b => b.addEventListener('click', () => { d.cargo = b.dataset.c; $$('#cb-cargo button', fl).forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); }); }));
    $('#cb-acesso', fl).addEventListener('change', e => { $('#cb-acesso-campos', fl).hidden = !e.target.checked; });
    $('#cb-usuario', fl).addEventListener('input', () => { usuarioMexido = true; });
    $('#cb-nome', fl).addEventListener('input', e => { if (!usuarioMexido) $('#cb-usuario', fl).value = sugerirUsuario(e.target.value); });
    $('#cb-gerar', fl).addEventListener('click', () => { $('#cb-senha', fl).value = gerarSenha(); erro.textContent = ''; });
    const exc = $('#cb-excluir', fl);
    let confirma = false;
    if (exc) exc.addEventListener('click', async () => {
      if (!confirma) { confirma = true; exc.textContent = 'Toque de novo para excluir (prefira desativar)'; return; }
      try { await api('colaborador_excluir', { id: c.id }); f.fechar(); avisar('Cadastro excluído'); carregarColaboradores(); }
      catch (x) { erro.textContent = x.message; }
    });
    $('#f-colab', fl).addEventListener('submit', async e => {
      e.preventDefault();
      const corpo = {
        id: c ? c.id : undefined, nome: $('#cb-nome', fl).value.trim(), cargo: d.cargo, telefone: $('#cb-tel', fl).value.trim(),
        creci: $('#cb-creci', fl).value.trim(), email: $('#cb-email', fl).value.trim(), acesso: $('#cb-acesso', fl).checked,
        usuario: $('#cb-usuario', fl).value.trim().toLowerCase(), senha: $('#cb-senha', fl).value, ativo: c ? $('#cb-ativo', fl).checked : true
      };
      if (!corpo.nome) { erro.textContent = 'Informe o nome do colaborador.'; $('#cb-nome', fl).focus(); return; }
      if (corpo.acesso && !corpo.senha && (nova || !c.acesso)) { erro.textContent = 'Crie uma senha para o acesso (ou toque em Gerar).'; $('#cb-senha', fl).focus(); return; }
      const ok = $('#cb-ok', fl); ok.disabled = true;
      try {
        await api('colaborador_salvar', corpo);
        carregarColaboradores();
        if (corpo.acesso && corpo.senha) acessoCriado(f, corpo, nova);
        else { f.fechar(); avisar(nova ? 'Colaborador cadastrado' : 'Alterações salvas'); }
      } catch (x) {
        if (x.status === 401) { f.fechar(); return entrada(); }
        erro.textContent = x.message; ok.disabled = false;
      }
    });
  }
  // Depois de criar ou trocar a senha: mostra o acesso para enviar ao colaborador
  function acessoCriado(f, c, nova) {
    const link = location.origin + '/';
    const txt = `Olá, ${primeiroNome(c.nome)}! ${nova ? 'Seu acesso ao' : 'Sua nova senha do'} ${NOME_HUB}:\n${link}\nUsuário: ${c.usuario}\nSenha: ${c.senha}\nNo primeiro acesso, troque a senha no botão da sua conta.`;
    f.trocar(`<h3>${nova ? 'Acesso criado' : 'Senha alterada'}</h3>
      <p class="ajuda" style="margin-bottom:12px">Envie para ${esc(primeiroNome(c.nome))}. A senha não aparece de novo depois que você fechar esta janela.</p>
      <div class="credenciais"><span>Endereço: <code>${esc(link)}</code></span><span>Usuário: <b><code>${esc(c.usuario)}</code></b></span><span>Senha: <b><code>${esc(c.senha)}</code></b></span></div>
      <div class="lista-botoes" style="margin-top:14px">
        ${c.telefone ? `<a class="item-conta" href="${esc(wa(c.telefone) + '?text=' + encodeURIComponent(txt))}" target="_blank" rel="noopener">${svg(IC.whats)}<span>Enviar pelo WhatsApp<small>${esc(c.telefone)}</small></span></a>` : ''}
        <button type="button" class="item-conta" id="ac-copiar">${svg(IC.copiar)}<span>Copiar o acesso<small>Para colar onde quiser</small></span></button>
      </div>
      <div class="fim-folha"><button type="button" class="b-salvar tap" id="ac-ok">Concluir</button></div>`);
    $('#ac-copiar', f.fl).addEventListener('click', async () => { try { await navigator.clipboard.writeText(txt); avisar('Acesso copiado'); } catch (e) { avisar('Não consegui copiar. Selecione o texto e copie.'); } });
    $('#ac-ok', f.fl).addEventListener('click', f.fechar);
  }

  // ---------- tema e conta ----------
  function aplicarTema(escuro) {
    document.documentElement.dataset.theme = escuro ? 'dark' : 'light';
    $('#tema').innerHTML = svg(escuro ? IC.sol : IC.lua);
    $('#tema').setAttribute('aria-label', escuro ? 'Modo claro' : 'Modo escuro');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', escuro ? '#091416' : '#F3F5F4');
  }
  $('#tema').addEventListener('click', () => {
    const escuro = document.documentElement.dataset.theme !== 'dark';
    aplicarTema(escuro);
    guardar('tema', escuro ? 'dark' : 'light');
  });
  const nomeConta = () => EU && !ehAdmin() ? EU.nome : CFG.empresa;
  const iniciaisConta = () => EU && !ehAdmin() ? iniciaisDe(EU.nome) : INICIAIS;
  function abrirConta(ir) {
    if (!EU) return;
    const f = abrirFolha('Conta', '');
    const inicio = () => {
      f.trocar(`<div class="ficha-topo"><span class="avatar">${esc(iniciaisConta())}</span><div><b>${esc(nomeConta())}</b><small>${DEMO ? 'Modo exemplo · ' : ''}${ehAdmin() ? 'Administrador' : esc(EU.cargo || 'Colaborador')} · usuário ${esc(EU.usuario || '')}</small></div></div>
        <div class="lista-botoes">
          <button type="button" class="item-conta" data-c="senha">${svg(IC.chave)}<span>Trocar minha senha<small>Pede a senha atual</small></span></button>
          <button type="button" class="item-conta perigo" data-c="sair">${svg(IC.sair)}<span>Sair<small>Pede usuário e senha de novo neste aparelho</small></span></button>
        </div>`);
    };
    const senha = () => {
      f.trocar(`<h3>Trocar minha senha</h3>
        <form id="f-senha" novalidate>
          <label for="ts-atual">Senha atual</label><input class="campo" id="ts-atual" type="password" autocomplete="current-password">
          <label for="ts-nova">Senha nova</label><input class="campo" id="ts-nova" type="password" autocomplete="new-password" placeholder="mínimo 6 caracteres">
          <label for="ts-repete">Repita a senha nova</label><input class="campo" id="ts-repete" type="password" autocomplete="new-password">
          <p class="erro-f" id="ts-erro" role="alert"></p>
          <div class="fim-folha"><button type="button" class="b-cancelar tap" id="ts-voltar">Voltar</button><button class="b-salvar tap" id="ts-ok">Trocar senha</button></div>
        </form>`);
      setTimeout(() => $('#ts-atual', f.fl)?.focus(), 300);
      $('#ts-voltar', f.fl).addEventListener('click', inicio);
      $('#f-senha', f.fl).addEventListener('submit', async e => {
        e.preventDefault();
        const atual = $('#ts-atual', f.fl).value, nova = $('#ts-nova', f.fl).value, err = $('#ts-erro', f.fl);
        if (nova.length < 6) { err.textContent = 'A senha nova precisa ter pelo menos 6 caracteres.'; return; }
        if (nova !== $('#ts-repete', f.fl).value) { err.textContent = 'As duas senhas novas não são iguais.'; return; }
        const b = $('#ts-ok', f.fl); b.disabled = true;
        try { await api('senha_trocar', { atual, nova }); f.fechar(); avisar('Senha trocada. Os outros aparelhos vão pedir a senha nova.'); }
        catch (x) { if (x.status === 401) { f.fechar(); return entrada(); } err.textContent = x.message; b.disabled = false; }
      });
    };
    f.fl.addEventListener('click', async e => {
      const b = e.target.closest('[data-c]'); if (!b) return;
      if (b.dataset.c === 'senha') senha();
      if (b.dataset.c === 'sair') { f.fechar(); try { await api('sair'); } catch (x) {} EU = null; entrada(); }
    });
    if (ir === 'senha') senha(); else inicio();
  }
  $('#conta').addEventListener('click', () => abrirConta());

  // ---------- números ao vivo: atualiza sozinho a cada minuto e quando você volta para a aba ----------
  let atualizando = false;
  async function atualizarNumeros() {
    if (DEMO || atualizando || document.hidden || !$('#entrada').hidden || buscaAberta || document.querySelector('.folha')) return;
    atualizando = true;
    try {
      const d = await api('dados');
      if (d && d.numeros && JSON.stringify(d.numeros) !== JSON.stringify(numeros)) { numeros = d.numeros; desenhar(true); }
      if (vistaAtual() === 'colaboradores') carregarColaboradores();
    } catch (e) { if (e.status === 401) entrada(); }
    atualizando = false;
  }
  setInterval(atualizarNumeros, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) atualizarNumeros(); });

  // ---------- carregar e entrar ----------
  function pintarConta() {
    $('#conta').textContent = iniciaisConta();
    $('#conta').setAttribute('aria-label', 'Conta de ' + nomeConta());
    const h = new Date().getHours();
    $('#saudacao').textContent = (h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + (EU && !ehAdmin() ? ', ' + primeiroNome(EU.nome) : CFG.saudacao ? ', ' + CFG.saudacao : '');
  }
  async function carregar() {
    try {
      const d = await api('dados');
      EU = d.usuario || EU;
      numeros = (d && d.numeros) || {};
      $('#exemplo').hidden = !DEMO;
      pintarConta();
      desenhar(true);
      mostrarVista();
    } catch (e) {
      if (e.status === 401) return entrada();
      avisar(e.message);
    }
  }
  function entrada() {
    const t = $('#entrada'); t.hidden = false;
    if (DEMO) $('#e-sub').textContent = 'Exemplo: digite qualquer usuário e senha para entrar.';
    setTimeout(() => $('#e-usuario').focus(), 300);
    $('#f-entrar').onsubmit = async ev => {
      ev.preventDefault();
      const usuario = $('#e-usuario').value.trim(), senha = $('#e-senha').value;
      if (!usuario || !senha) { $('#e-erro').textContent = 'Preencha o usuário e a senha.'; return; }
      const btn = $('#e-ok'); btn.disabled = true; btn.textContent = 'Entrando…'; $('#e-erro').textContent = '';
      try {
        const r = await api('entrar', { usuario, senha });
        EU = r.usuario || null;
        t.hidden = true; $('#e-senha').value = '';
        await carregar();
      } catch (x) { $('#e-erro').textContent = x.message; $('#e-senha').select(); }
      btn.disabled = false; btn.textContent = 'Entrar';
    };
  }

  // ---------- primeira pintura ----------
  $('#e-titulo').textContent = NOME_HUB;
  $('#rodape').innerHTML = CFG.site ? `<a href="${esc(CFG.site)}" target="_blank" rel="noopener">${esc(CFG.empresa)}</a>` : esc(CFG.empresa);
  if (CFG.logo) $$('[data-logo]').forEach(s => { const i = document.createElement('img'); i.src = CFG.logo; i.alt = ''; i.setAttribute('class', s.getAttribute('class') || ''); s.replaceWith(i); });
  const dt = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#data').textContent = dt.charAt(0).toUpperCase() + dt.slice(1);
  aplicarTema(document.documentElement.dataset.theme === 'dark');
  $('#buscar').innerHTML = svg(IC.busca);
  $('#buscar2').insertAdjacentHTML('afterbegin', svg(IC.busca, 2.2));
  if (/Mac|iPhone|iPad/i.test(navigator.platform || navigator.userAgent || '')) $('#buscar2 kbd').textContent = '⌘ K';
  pintarConta();
  pintarAgenda();
  mostrarVista();
  desenhar();
  (async () => {
    try {
      const s = await api('sessao');
      if (s.logado) { EU = s.usuario || null; carregar(); } else entrada();
    } catch (e) { avisar(e.message); }
  })();
})();
</script>
</body>
</html>
